name: Build

on:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs: a newer push to the same PR makes in-flight runs stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    env:
      TAG_PREFIX: "v26.2"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Get latest tag
        id: get-latest-tag
        run: |
          # 1. Try finding the latest tag with PREFIX on the current branch
          LATEST_TAG=$(git tag -l --merged HEAD --sort=-v:refname "${TAG_PREFIX}*" | head -n 1)

          # 2. Fallback: Find exact 'vMajor.Minor.Patch' tag on this branch and reformat to PREFIX-vX.Y.Z
          if [ -z "$LATEST_TAG" ]; then
            echo "No prefix tag found on this branch. Searching for exact vX.Y.Z tag on branch..."

            # Strict regex for vMajor.Minor.Patch (e.g. v1.2.3, ignores pre-releases like -rc1)
            RAW_TAG=$(git tag -l --merged HEAD --sort=-v:refname "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

            if [ -n "$RAW_TAG" ]; then
              # Reformat "v1.2.3" -> "v26.2-v1.2.3"
              LATEST_TAG="${TAG_PREFIX}-${RAW_TAG}"
            fi
          fi

          # 3. Default Fallback: If no valid tags exist on this branch at all
          if [ -z "$LATEST_TAG" ]; then
          echo "No valid tags found on this branch. Using default fallback..."
          LATEST_TAG="${TAG_PREFIX}-v0.0.0"
          fi

          echo "Found tag $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Compile and assemble
        run: ./gradlew assemble testClasses --refresh-dependencies
