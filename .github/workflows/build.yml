name: Build

on:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs: a newer push to the same PR makes in-flight runs stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    env:
      TAG_PREFIX: "v26.2"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetches full commit history (required for --merged HEAD)
          fetch-tags: true # Ensures all remote tags are downloaded

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Get latest tag
        id: get-latest-tag
        run: |
          # 1. Try finding the latest tag with TAG_PREFIX on the current branch (e.g., v26.2-v4.116.3)
          LATEST_TAG=$(git tag -l --merged HEAD --sort=-v:refname "${TAG_PREFIX}*" | head -n 1)

          # 2. Fallback: Match exact 'vX.Y.Z' (e.g. v4.116.3) on this branch and convert to TAG_PREFIX-vX.Y.Z
          if [ -z "$LATEST_TAG" ]; then
            echo "No prefix tag found on this branch. Searching for exact vX.Y.Z tag..."

            RAW_TAG=$(git tag -l --merged HEAD --sort=-v:refname "v*" | grep -m 1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$')

            if [ -n "$RAW_TAG" ]; then
              # Converts "v4.116.1" -> "v26.2-v4.116.1"
              LATEST_TAG="${TAG_PREFIX}-${RAW_TAG}"
            fi
          fi

          # 3. Default Fallback: If no tags exist on this branch at all
          if [ -z "$LATEST_TAG" ]; then
            echo "No valid tags found on this branch. Using default fallback..."
            LATEST_TAG="${TAG_PREFIX}-v0.0.0"
          fi

          echo "Found tag $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Compile and assemble
        run: ./gradlew assemble testClasses --refresh-dependencies
